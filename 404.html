<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page introuvable — Even ANICET</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#1a1a1a">
    <link rel="icon" type="image/svg+xml" href="/favicon_1.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root { --bg:#1a1a1a; --white:#fff; --red:#FF364A; --muted:rgba(255,255,255,0.45); }
        * { box-sizing:border-box; }
        html, body { height:100%; }
        body {
            margin:0; background:var(--bg); color:var(--white);
            font-family:'Space Grotesk', sans-serif; font-weight:300;
            display:flex; flex-direction:column;
            align-items:center; justify-content:center;
            text-align:center; padding:40px 24px;
            min-height:100vh; min-height:100dvh;
        }
        .code {
            font-family:'Bebas Neue','Impact',sans-serif; font-weight:400;
            font-size:clamp(6rem, 26vw, 16rem); line-height:0.82;
            letter-spacing:0.02em; margin:0;
        }
        .rule { width:min(320px, 70vw); height:26px; margin:14px 0 30px; }
        .rule path { fill:none; stroke:var(--red); stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
        h1 {
            font-family:'Bebas Neue','Impact',sans-serif; font-weight:400;
            font-size:clamp(1.6rem, 5vw, 2.4rem); letter-spacing:0.04em;
            margin:0 0 14px;
        }
        p { color:var(--muted); font-size:1rem; max-width:44ch; line-height:1.7; margin:0 0 40px; }
        .back {
            position:relative; display:inline-flex; align-items:center; justify-content:center;
            padding:16px 34px; min-height:48px;
            color:var(--white); text-decoration:none;
            font-size:0.82rem; letter-spacing:0.18em; text-transform:uppercase;
        }
        .back svg { position:absolute; inset:0; width:100%; height:100%; }
        .back path { fill:none; stroke:var(--red); stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
        .back span { position:relative; }
        .back:hover { color:var(--red); }
        .back:focus-visible { outline:2px solid var(--red); outline-offset:6px; }
    </style>
</head>
<body>
    <p class="code">404</p>

    <svg class="rule" viewBox="0 0 320 26" preserveAspectRatio="none" aria-hidden="true">
        <path d="M4 15 L38 11 L74 17 L112 10 L151 16 L190 11 L228 17 L266 12 L316 15"/>
    </svg>

    <h1>Cette page n'existe pas</h1>
    <p>Le lien est peut-être erroné, ou la page a été déplacée. Le portfolio, lui, est toujours là.</p>

    <a class="back" href="/">
        <svg viewBox="0 0 200 60" preserveAspectRatio="none" aria-hidden="true">
            <path d="M6 5 L192 3 L196 8 L194 52 L190 57 L8 55 L4 50 L5 10 Z"/>
        </svg>
        <span>Retour au portfolio</span>
    </a>
</body>
</html>
