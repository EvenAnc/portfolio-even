<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Even ANICET — Architecte d'intérieur</title>
    <meta name="robots" content="noindex">
    <link rel="canonical" href="https://even-anc.com/">
    <!-- Rattrapage d'une ancienne redirection IONOS.
         Avant que le domaine ne soit heberge par GitHub, IONOS servait une
         page de parking qui redirigeait en 301 vers /defaultsite. Un 301 est
         mis en cache par les navigateurs de facon quasi definitive : les
         visiteurs qui ont ouvert even-anc.com a cette epoque continuent d'etre
         reecrits vers /defaultsite AVANT meme de contacter le serveur.
         Aucun reglage serveur ne peut effacer un cache client. En revanche on
         peut lui servir cette page a l'adresse qu'il reclame, et le renvoyer
         immediatement a l'accueil. -->
    <meta http-equiv="refresh" content="0; url=/">
    <script>location.replace('/');</script>
    <style>
        body { margin:0; min-height:100vh; display:flex; align-items:center;
               justify-content:center; background:#1a1a1a; color:rgba(255,255,255,.45);
               font-family:system-ui,-apple-system,'Segoe UI',sans-serif; font-size:.95rem; }
        a { color:#FF364A; }
    </style>
</head>
<body>
    <p>Redirection vers le portfolio&hellip; <a href="/">continuer</a></p>
</body>
</html>
